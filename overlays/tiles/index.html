<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>イベント一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    イベント一覧（どのギフトで何が起きるかを、視聴者に見せる一覧）
    OBSの「ブラウザ」ソースに、次のURLを入れて使う：
      http://127.0.0.1:3939/overlay/tiles/
    おすすめの大きさ：幅 1920 × 高さ 1080（配信の画面と同じ）

    中身は「ルール」画面から自動で作られます。
    出す・出さない、並び順、色は、ルールごとに「ルール」画面で決められます。
  -->
  <div id="grid"></div>

  <!-- タイル1つ分のひな形（script.js がコピーして使う） -->
  <template id="tile-template">
    <div class="tile">
      <div class="tile-gifts"></div>
      <img class="tile-image" alt="" hidden>
      <div class="tile-name"></div>
      <div class="tile-trigger"></div>
      <div class="tile-repeat" hidden></div>
    </div>
  </template>

  <script src="/overlay/common/overlay-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
