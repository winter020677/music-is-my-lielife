<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>読み上げ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    読み上げ用オーバーレイ（音だけ。画面には何も出ない）
    OBSの「ブラウザ」ソースに、次のURLを入れて使う：
      http://127.0.0.1:3939/overlay/speech/
    ・「OBSで音声を制御する」にチェックを入れる（配信の音に乗り、OBSの音声ミキサーで音量を変えられる）
    ・大きさは小さくてよい（例：幅 300 × 高さ 100）
    ・URLの最後に ?debug=1 を付けると、読み上げている文が画面に出る（確認用）
  -->
  <div id="debug" hidden></div>
  <button id="unlock" type="button" hidden>クリックすると音が出るようになります</button>

  <script src="/overlay/common/overlay-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
